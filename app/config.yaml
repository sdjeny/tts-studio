# LLM 配置（OpenAI 协议）
llm:
  # API 地址，如 https://api.openai.com/v1
  base_url: "url"
  # API Key
  api_key: "key"
  # 模型名称
  model: "model"
  # 请求超时（秒）
  timeout: 120
  # 最大 token 数
  max_tokens: 128000
  # 温度
  temperature: 0.7

tts:
  base_url: "http://localhost:8420"

# 生成默认值（集数、时长、旁白比例等）
gen:
  defaults:
    num_episodes: 3
    target_duration_min: 25
    narration_ratio: 50
