services:
  tts-studio:
    build:
      context: .
    container_name: tts-studio
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - DATA_DIR=/app/data
      - TTS_API_BASE=${TTS_API_BASE:-http://host.docker.internal:8001}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"